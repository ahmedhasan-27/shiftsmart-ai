# AWS App Runner configuration for ShiftSmart AI React app
# https://docs.aws.amazon.com/apprunner/latest/dg/config-file-ref.html
version: 1.0
runtime: nodejs22

build:
  commands:
    pre-build:
      - npm install
    build:
      - npm run build
  # Optional: uncomment to pin Node version
  # env:
  #   - name: NODE_ENV
  #     value: production

run:
  command: npx serve -s dist -l 8080
  network:
    port: 8080
